[supervisord]
nodaemon=false
logfile=/home/user/webapp/logs/supervisord_downloads.log
pidfile=/home/user/webapp/logs/supervisord_downloads.pid

[unix_http_server]
file=/home/user/webapp/logs/supervisor_downloads.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/logs/supervisor_downloads.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:download_server]
command=python3 -m http.server 8082 --bind 0.0.0.0 --directory /home/user/webapp/downloads
directory=/home/user/webapp/downloads
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/logs/downloads.log
stderr_logfile=/home/user/webapp/logs/downloads_error.log
user=user
environment=HOME="/home/user",USER="user"
