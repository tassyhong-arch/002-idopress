[supervisord]
nodaemon=false
logfile=/home/user/webapp/idopress/logs/supervisord.log
pidfile=/home/user/webapp/idopress/logs/supervisord.pid

[unix_http_server]
file=/home/user/webapp/idopress/logs/supervisor.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/idopress/logs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:frontend_static]
command=python3 -m http.server 3001 --bind 0.0.0.0
directory=/home/user/webapp/idopress/frontend/dist
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/idopress/logs/frontend_static.log
stderr_logfile=/home/user/webapp/idopress/logs/frontend_static_error.log