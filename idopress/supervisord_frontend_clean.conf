[supervisord]
nodaemon=false
logfile=/home/user/webapp/idopress/logs/supervisord_frontend.log
pidfile=/home/user/webapp/idopress/logs/supervisord_frontend.pid

[unix_http_server]
file=/home/user/webapp/idopress/logs/supervisor_frontend.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/idopress/logs/supervisor_frontend.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:frontend]
command=python3 -m http.server 3000 --bind 0.0.0.0 --directory /home/user/webapp/idopress/frontend/dist
directory=/home/user/webapp/idopress/frontend/dist
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/idopress/logs/frontend.log
stderr_logfile=/home/user/webapp/idopress/logs/frontend_error.log
user=user
environment=HOME="/home/user",USER="user"
