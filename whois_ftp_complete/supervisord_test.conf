[supervisord]
nodaemon=false
logfile=/home/user/webapp/whois_ftp_complete/supervisord.log
pidfile=/home/user/webapp/whois_ftp_complete/supervisord.pid

[unix_http_server]
file=/home/user/webapp/whois_ftp_complete/supervisor.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/whois_ftp_complete/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:flask_app]
command=python3 /home/user/webapp/whois_ftp_complete/api/app.py
directory=/home/user/webapp/whois_ftp_complete/api
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/whois_ftp_complete/flask_app.log
stderr_logfile=/home/user/webapp/whois_ftp_complete/flask_app_error.log
environment=PYTHONPATH="/home/user/webapp/whois_ftp_complete/api"