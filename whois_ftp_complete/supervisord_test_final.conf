[supervisord]
nodaemon=false
logfile=/home/user/webapp/whois_ftp_complete/supervisord.log
pidfile=/home/user/webapp/whois_ftp_complete/supervisord.pid

[unix_http_server]
file=/home/user/webapp/whois_ftp_complete/supervisor.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/whois_ftp_complete/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:test_flask_app]
command=python3 -c "from test_app import app, init_test_db; init_test_db(); app.run(debug=False, host='0.0.0.0', port=5001)"
directory=/home/user/webapp/whois_ftp_complete/api
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/whois_ftp_complete/test_flask_app.log
stderr_logfile=/home/user/webapp/whois_ftp_complete/test_flask_app_error.log
environment=PYTHONPATH="/home/user/webapp/whois_ftp_complete/api"